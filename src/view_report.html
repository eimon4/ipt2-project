<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwiftTrack - View Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <!-- Dynamic Top Navbar -->
  <div id="navbar-container"></div>

  <main class="max-w-3xl mx-auto p-4 sm:p-6 mt-4">
    <!-- Back Navigation -->
    <div class="mb-4">
      <button onclick="goBack()" class="text-blue-600 hover:text-blue-800 hover:underline text-sm font-medium inline-flex items-center gap-1">
        &larr; <span id="back-label">Back</span>
      </button>
    </div>

    <!-- Loading State -->
    <div id="report-loading" class="text-center py-16 text-gray-500">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-900 border-t-transparent mb-2"></div>
      <p>Loading report details...</p>
    </div>

    <!-- Report Details Card -->
    <div id="report-card" class="hidden bg-white shadow rounded-lg p-6 sm:p-8 border border-gray-100">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
        <h1 id="rep-title" class="text-2xl font-bold text-gray-900"></h1>
        <span id="rep-category" class="text-xs px-2.5 py-0.5 rounded-full font-medium"></span>
      </div>

      <!-- Metadata details -->
      <div class="text-sm text-gray-500 mb-6 flex flex-wrap items-center gap-x-6 gap-y-2 border-b border-gray-100 pb-4">
        <span><strong>Reported by:</strong> <span id="rep-author" class="text-gray-700"></span> (<span id="rep-email" class="text-gray-600"></span>)</span>
        <span><strong>Date:</strong> <span id="rep-date" class="text-gray-700"></span></span>
        <span class="flex items-center gap-1.5"><strong>Status:</strong> <span id="rep-status"></span></span>
      </div>

      <!-- Supporting Image (if uploaded) -->
      <div id="image-container" class="hidden mb-6">
        <h3 class="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-2">Attached Image</h3>
        <a id="image-link" href="#" target="_blank" rel="noopener noreferrer">
          <img 
            id="rep-image" 
            src="" 
            alt="Attached Incident Evidence" 
            class="max-h-96 w-auto rounded border border-gray-200 object-contain hover:opacity-95 transition" 
          />
        </a>
        <p class="text-xs text-gray-400 mt-1">Click the image to view in full resolution.</p>
      </div>

      <!-- Description Section -->
      <div class="border-t border-gray-100 pt-5">
        <h3 class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-2">Description</h3>
        <p id="rep-desc" class="whitespace-pre-wrap text-gray-800 leading-relaxed text-sm sm:text-base"></p>
      </div>

      <!-- Owner Actions: Edit & Delete (shown only to report author) -->
      <div id="owner-actions" class="hidden border-t border-gray-100 mt-6 pt-5">
        <div class="flex items-center gap-3">
          <button 
            onclick="showEditForm()" 
            class="inline-flex items-center gap-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-sm font-medium px-4 py-2 rounded transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            Edit Report
          </button>
          <button 
            onclick="deleteReport()" 
            class="inline-flex items-center gap-1.5 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 text-sm font-medium px-4 py-2 rounded transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Delete Report
          </button>
        </div>
      </div>

      <!-- Edit Form (hidden by default, replaces card content when editing) -->
      <div id="edit-form-section" class="hidden border-t border-gray-100 mt-6 pt-5">
        <h3 class="text-sm font-semibold text-gray-900 mb-4">Edit Report</h3>
        <form id="edit-form" class="space-y-4">
          <div>
            <label for="edit-title" class="block text-sm font-medium mb-1 text-gray-700">Title</label>
            <input 
              id="edit-title" 
              type="text" 
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
              required 
            />
          </div>

          <div>
            <label for="edit-category" class="block text-sm font-medium mb-1 text-gray-700">Category</label>
            <select 
              id="edit-category" 
              class="w-full border rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-800"
              required
            >
              <option value="Lost & Found">Lost &amp; Found</option>
              <option value="Incident">Incident</option>
              <option value="Emergency">Emergency</option>
              <option value="Other">Other School Concern</option>
            </select>
          </div>

          <div>
            <label for="edit-description" class="block text-sm font-medium mb-1 text-gray-700">Description</label>
            <textarea 
              id="edit-description" 
              rows="5" 
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
              required
            ></textarea>
          </div>

          <div>
            <label for="edit-image-file" class="block text-sm font-medium mb-1 text-gray-700">
              Replace Image <span class="text-xs text-gray-400 font-normal">(Optional — leave empty to keep current image)</span>
            </label>
            <input 
              id="edit-image-file" 
              type="file" 
              accept="image/*"
              class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-900 hover:file:bg-blue-100 cursor-pointer" 
            />
            <div id="edit-preview-container" class="hidden mt-2">
              <img id="edit-image-preview" src="" alt="New Image Preview" class="h-28 w-auto rounded border object-cover" />
            </div>
          </div>

          <div class="flex items-center gap-3 pt-2">
            <button 
              id="edit-save-btn"
              type="submit" 
              class="bg-blue-900 hover:bg-blue-800 text-white font-medium text-sm rounded px-5 py-2 transition"
            >
              Save Changes
            </button>
            <button 
              type="button"
              onclick="cancelEdit()" 
              class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium text-sm rounded px-5 py-2 transition"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>

      <!-- Status & Progress Update (For Report Author or Admins) -->
      <div id="status-update-section" class="hidden border-t border-gray-100 mt-6 pt-5 bg-blue-50/40 p-4 rounded-lg border border-blue-100">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h3 class="text-sm font-semibold text-gray-900" id="status-update-heading">Update Status</h3>
            <p class="text-xs text-gray-500 mt-0.5" id="status-update-subtext">You reported this item. Update whether it is still missing or has been found.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2" id="status-update-buttons">
            <!-- Buttons dynamically generated -->
          </div>
        </div>
      </div>

      <!-- Admin Actions (Only shown if current user is admin) -->
      <div id="admin-actions" class="hidden border-t border-gray-100 mt-6 pt-5">
        <h3 class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-3">Administrator Workflow Actions</h3>
        <div class="flex flex-wrap gap-3">
          <button 
            onclick="changeStatus('approved')" 
            class="bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-4 py-2 rounded transition"
          >
            Approve Report
          </button>
          <button 
            onclick="changeStatus('rejected')" 
            class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded transition"
          >
            Reject Report
          </button>
          <button 
            onclick="changeStatus('resolved')" 
            class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded transition"
          >
            Mark as Resolved
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentReport = null;
    let currentUser = null;

    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Check user login
      currentUser = await requireAuth();
      if (!currentUser) return;

      // Update back button text based on role
      const backLabel = document.getElementById('back-label');
      if (document.referrer.includes('admin.html') || currentUser.role === 'admin') {
        backLabel.textContent = 'Back to Admin Dashboard';
      } else {
        backLabel.textContent = 'Back to Feed';
      }

      // 2. Get ID from URL query parameters (e.g. view_report.html?id=5)
      const urlParams = new URLSearchParams(window.location.search);
      const reportId = urlParams.get('id');

      if (!reportId) {
        alert('No report ID specified.');
        window.location.href = 'feed.html';
        return;
      }

      await loadReport(reportId);

      // Auto-open edit form if ?edit=1 is in URL
      if (urlParams.get('edit') === '1') {
        setTimeout(() => showEditForm(), 300);
      }
    });

    // Go back intelligently
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = currentUser?.role === 'admin' ? 'admin.html' : 'feed.html';
      }
    }

    // Load report from Supabase
    async function loadReport(id) {
      const loading = document.getElementById('report-loading');
      const card = document.getElementById('report-card');

      try {
        if (!isConfigured()) return;

        const { data, error } = await supabaseClient
          .from('reports')
          .select('*')
          .eq('id', id)
          .single();

        if (error) throw error;
        if (!data) throw new Error('Report not found');

        currentReport = data;

        // Populate elements
        document.getElementById('rep-title').textContent = data.title;
        document.getElementById('rep-author').textContent = data.user_name || 'Anonymous Student';
        document.getElementById('rep-email').textContent = data.user_email || 'No email provided';
        document.getElementById('rep-desc').textContent = data.description;

        // Category Badge
        const catElem = document.getElementById('rep-category');
        catElem.textContent = data.category || 'Incident';
        if (data.category === 'Lost & Found') {
          catElem.className = 'text-xs px-2.5 py-0.5 rounded-full font-medium bg-indigo-50 text-indigo-700 border border-indigo-200';
        } else if (data.category === 'Emergency') {
          catElem.className = 'text-xs px-2.5 py-0.5 rounded-full font-medium bg-red-50 text-red-700 border border-red-200';
        } else {
          catElem.className = 'text-xs px-2.5 py-0.5 rounded-full font-medium bg-amber-50 text-amber-700 border border-amber-200';
        }

        // Status Badge using shared helper
        const statusElem = document.getElementById('rep-status');
        statusElem.innerHTML = renderStatusBadge(data);

        // Date
        const dateStr = new Date(data.created_at).toLocaleString('en-US', {
          dateStyle: 'medium',
          timeStyle: 'short'
        });
        document.getElementById('rep-date').textContent = dateStr;

        // Image
        if (data.image_url) {
          const imgContainer = document.getElementById('image-container');
          const img = document.getElementById('rep-image');
          const imgLink = document.getElementById('image-link');
          img.src = data.image_url;
          imgLink.href = data.image_url;
          imgContainer.classList.remove('hidden');
        }

        // Status update section for report owner OR admin
        const isOwner = currentUser && (currentUser.id === data.user_id || (currentUser.email && currentUser.email === data.user_email));
        const isAdmin = currentUser && (currentUser.role === 'admin');

        const updateSection = document.getElementById('status-update-section');
        const updateBtns = document.getElementById('status-update-buttons');
        const updateHeading = document.getElementById('status-update-heading');
        const updateSubtext = document.getElementById('status-update-subtext');

        if (isOwner || isAdmin) {
          updateSection.classList.remove('hidden');

          const isLostFound = (data.category === 'Lost & Found');
          const itemStatus = getItemStatus(data);
          const isFoundOrResolved = (itemStatus === 'Found' || itemStatus === 'Resolved' || data.status === 'resolved');

          if (isOwner && !isAdmin) {
            updateHeading.textContent = isLostFound ? 'Update Item Status' : 'Update Incident Status';
            updateSubtext.textContent = isLostFound 
              ? 'Did someone find or return this item? Update its status here.' 
              : 'Has this issue or incident been resolved?';
          } else if (isAdmin) {
            updateHeading.textContent = isLostFound ? 'Item Status (Admin)' : 'Incident Status (Admin)';
            updateSubtext.textContent = 'Quickly update the resolution status of this report.';
          }

          if (isLostFound) {
            updateBtns.innerHTML = `
              <button 
                onclick="handleItemStatusUpdate('Still Missing', 'approved')"
                class="px-3.5 py-1.5 rounded text-xs font-semibold border transition ${
                  !isFoundOrResolved 
                    ? 'bg-rose-600 text-white border-rose-600 shadow-sm' 
                    : 'bg-white text-rose-700 border-rose-200 hover:bg-rose-50'
                }"
              >
                ✕ Still Missing
              </button>
              <button 
                onclick="handleItemStatusUpdate('Found', 'resolved')"
                class="px-3.5 py-1.5 rounded text-xs font-semibold border transition ${
                  isFoundOrResolved 
                    ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                    : 'bg-white text-emerald-700 border-emerald-300 hover:bg-emerald-50'
                }"
              >
                ✓ Already Found / Returned
              </button>
            `;
          } else {
            updateBtns.innerHTML = `
              <button 
                onclick="handleItemStatusUpdate('In Progress', 'approved')"
                class="px-3.5 py-1.5 rounded text-xs font-medium border transition ${
                  !isFoundOrResolved 
                    ? 'bg-amber-600 text-white border-amber-600 shadow-sm' 
                    : 'bg-white text-amber-700 border-amber-200 hover:bg-amber-50'
                }"
              >
                • In Progress / Open
              </button>
              <button 
                onclick="handleItemStatusUpdate('Resolved', 'resolved')"
                class="px-3.5 py-1.5 rounded text-xs font-medium border transition ${
                  isFoundOrResolved 
                    ? 'bg-blue-600 text-white border-blue-600 shadow-sm' 
                    : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'
                }"
              >
                ✓ Mark as Resolved
              </button>
            `;
          }
        } else {
          updateSection.classList.add('hidden');
        }

        // Admin actions
        if (currentUser && currentUser.role === 'admin') {
          document.getElementById('admin-actions').classList.remove('hidden');
        }

        // Owner actions (Edit & Delete - visible to author and admins)
        if (isOwner || isAdmin) {
          document.getElementById('owner-actions').classList.remove('hidden');
        }

        loading.classList.add('hidden');
        card.classList.remove('hidden');
      } catch (err) {
        console.error('Error fetching report:', err);
        loading.innerHTML = `<p class="text-red-600">Report not found or error loading: ${err.message}</p>`;
      }
    }

    // Handle Item Status update (Owner or Admin)
    async function handleItemStatusUpdate(newItemStatus, newAdminStatus) {
      if (!currentReport) return;
      if (!confirm(`Confirm change status to "${newItemStatus}"?`)) return;

      try {
        await updateReportItemStatus(currentReport.id, newItemStatus, newAdminStatus);
        alert(`Status successfully updated to "${newItemStatus}"!`);
        await loadReport(currentReport.id);
      } catch (err) {
        alert('Failed to update status: ' + err.message);
      }
    }

    // ===================== EDIT REPORT =====================

    function showEditForm() {
      if (!currentReport) return;
      // Populate edit fields with current data
      document.getElementById('edit-title').value = currentReport.title || '';
      document.getElementById('edit-category').value = currentReport.category || 'Incident';
      document.getElementById('edit-description').value = currentReport.description || '';
      document.getElementById('edit-preview-container').classList.add('hidden');
      document.getElementById('edit-image-file').value = '';

      document.getElementById('edit-form-section').classList.remove('hidden');
      document.getElementById('edit-form-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function cancelEdit() {
      document.getElementById('edit-form-section').classList.add('hidden');
    }

    // Image preview for edit form
    document.getElementById('edit-image-file').addEventListener('change', function () {
      const file = this.files[0];
      const previewContainer = document.getElementById('edit-preview-container');
      const preview = document.getElementById('edit-image-preview');
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => { preview.src = e.target.result; previewContainer.classList.remove('hidden'); };
        reader.readAsDataURL(file);
      } else {
        previewContainer.classList.add('hidden');
        preview.src = '';
      }
    });

    // Save edits
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentReport) return;

      const saveBtn = document.getElementById('edit-save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const newTitle = document.getElementById('edit-title').value.trim();
        const newCategory = document.getElementById('edit-category').value;
        const newDesc = document.getElementById('edit-description').value.trim();
        const newImageFile = document.getElementById('edit-image-file').files[0];

        let imageUrl = currentReport.image_url; // keep existing image by default

        // Upload new image if one was selected
        if (newImageFile) {
          saveBtn.textContent = 'Uploading image...';
          const fileExt = newImageFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
          const filePath = `${currentUser.id}/${fileName}`;

          const { data: uploadData, error: uploadError } = await supabaseClient
            .storage
            .from('report-images')
            .upload(filePath, newImageFile);

          if (uploadError) {
            console.warn('Image upload failed, keeping existing image:', uploadError);
          } else {
            const { data: urlData } = supabaseClient
              .storage
              .from('report-images')
              .getPublicUrl(filePath);
            imageUrl = urlData?.publicUrl || imageUrl;
          }
        }

        saveBtn.textContent = 'Saving...';
        await updateReportById(currentReport.id, {
          title: newTitle,
          category: newCategory,
          description: newDesc,
          image_url: imageUrl
        });

        document.getElementById('edit-form-section').classList.add('hidden');
        alert('Report updated successfully!');
        await loadReport(currentReport.id);
      } catch (err) {
        alert('Failed to save changes: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    });

    // ===================== DELETE REPORT =====================

    async function deleteReport() {
      if (!currentReport) return;
      if (!confirm(`Are you sure you want to permanently delete "${currentReport.title}"?\n\nThis action cannot be undone.`)) return;

      try {
        await deleteReportById(currentReport.id);
        alert('Report deleted successfully.');
        window.location.href = currentUser?.role === 'admin' ? 'admin.html' : 'feed.html';
      } catch (err) {
        alert('Failed to delete report: ' + err.message);
      }
    }

    // Change report status as Admin
    async function changeStatus(newStatus) {
      if (!confirm(`Confirm change report status to "${newStatus}"?`)) return;

      try {
        const { error } = await supabaseClient
          .from('reports')
          .update({ 
            status: newStatus,
            updated_at: new Date().toISOString()
          })
          .eq('id', currentReport.id);

        if (error) throw error;

        alert(`Report status updated to ${newStatus}!`);
        // Reload report to reflect new status
        await loadReport(currentReport.id);
      } catch (err) {
        alert('Failed to update status: ' + err.message);
      }
    }
  </script>
</body>
</html>
