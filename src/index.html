<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwiftTrack - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 relative">
  <!-- Top Header Bar -->
  <header class="absolute top-0 left-0 w-full bg-blue-900 text-white shadow">
    <div class="w-full px-6 py-3 flex items-center justify-between">
      <div class="font-bold text-xl tracking-tight">SwiftTrack.</div>
    </div>
  </header>

  <!-- Login Card -->
  <div class="w-full max-w-md bg-white shadow rounded p-6 mt-12 sm:mt-0">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Login</h1>

    <!-- Error message alert -->
    <div id="error-box" class="hidden mb-4 p-3 rounded bg-red-100 text-red-700 text-sm"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium mb-1 text-gray-700">Email</label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          placeholder="student@school.edu"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
          required 
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1 text-gray-700">Password</label>
        <input 
          id="password" 
          name="password" 
          type="password" 
          placeholder="••••••••"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
          required 
        />
      </div>

      <button 
        id="submit-btn" 
        type="submit" 
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-medium rounded px-3 py-2 transition"
      >
        Sign In
      </button>
    </form>

    <p class="mt-4 text-sm text-center text-gray-600">
      No account? <a class="text-blue-600 hover:underline font-medium" href="register.html">Register</a>
    </p>
  </div>

  <script>
    // Check if the user is already logged in on page load
    window.addEventListener('DOMContentLoaded', async () => {
      checkConfigNotice();

      const user = await getCurrentUser();
      if (user) {
        // Redirect based on role
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'feed.html';
        }
      }
    });

    // Handle Login Form Submission
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      errorBox.textContent = '';

      if (!isConfigured()) {
        errorBox.textContent = 'Please configure your Supabase URL & Anon Key in supabase-config.js first.';
        errorBox.classList.remove('hidden');
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        // 1. Sign in with Supabase Auth
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          throw error;
        }

        // 2. Fetch user's role from profiles table
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .maybeSingle();

        const role = profile?.role || data.user.user_metadata?.role || 'user';

        // 3. Redirect to the appropriate page
        if (role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'feed.html';
        }
      } catch (err) {
        errorBox.textContent = err.message || 'Invalid email or password.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
