<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwiftTrack - Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <!-- Dynamic Top Navbar -->
  <div id="navbar-container"></div>

  <main class="max-w-5xl mx-auto p-4 mt-6">
    <div class="grid md:grid-cols-2 gap-6">
      <!-- Left Column: Submit Report Form -->
      <section class="bg-white shadow rounded p-6">
        <h2 class="text-xl font-semibold mb-4 text-gray-900">Submit Incident / Report</h2>

        <!-- Feedback Alerts -->
        <div id="info-box" class="hidden mb-4 p-3 rounded bg-green-100 text-green-700 text-sm"></div>
        <div id="error-box" class="hidden mb-4 p-3 rounded bg-red-100 text-red-700 text-sm"></div>

        <form id="report-form" class="space-y-4">
          <div>
            <label for="title" class="block text-sm font-medium mb-1 text-gray-700">Title</label>
            <input 
              id="title" 
              name="title" 
              type="text" 
              placeholder="e.g. Lost Blue Hydro Flask, Broken Window in 302"
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
              required 
            />
          </div>

          <div>
            <label for="category" class="block text-sm font-medium mb-1 text-gray-700">Category</label>
            <select 
              id="category" 
              name="category" 
              class="w-full border rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-800"
              required
            >
              <option value="Lost & Found">Lost &amp; Found</option>
              <option value="Incident" selected>Incident</option>
              <option value="Emergency">Emergency</option>
              <option value="Other">Other School Concern</option>
            </select>
          </div>

          <!-- Item status selector (appears when Lost & Found is chosen) -->
          <div id="item-status-group" class="hidden">
            <label for="item-status" class="block text-sm font-medium mb-1 text-gray-700">Item Status</label>
            <select 
              id="item-status" 
              name="item_status" 
              class="w-full border rounded px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-800"
            >
              <option value="Still Missing" selected>✕ Still Missing (I lost this item)</option>
              <option value="Found">✓ Found / Recovered (I found this item)</option>
            </select>
          </div>

          <div>
            <label for="image-file" class="block text-sm font-medium mb-1 text-gray-700">
              Supporting Image <span class="text-xs text-gray-400 font-normal">(Optional)</span>
            </label>
            <input 
              id="image-file" 
              type="file" 
              accept="image/*"
              class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-900 hover:file:bg-blue-100 cursor-pointer" 
            />
            <!-- Image preview -->
            <div id="preview-container" class="hidden mt-2">
              <img id="image-preview" src="" alt="Selected Preview" class="h-28 w-auto rounded border object-cover" />
            </div>
          </div>

          <div>
            <label for="description" class="block text-sm font-medium mb-1 text-gray-700">Description</label>
            <textarea 
              id="description" 
              name="description" 
              rows="5" 
              placeholder="Provide specific details about the incident or item..."
              class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
              required
            ></textarea>
          </div>

          <button 
            id="submit-btn" 
            type="submit" 
            class="bg-blue-900 hover:bg-blue-800 text-white font-medium rounded px-5 py-2 transition"
          >
            Submit Report
          </button>
        </form>
      </section>

      <!-- Right Column: My Reports List -->
      <section class="bg-white shadow rounded p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold text-gray-900">My Reports</h2>
          <button onclick="loadMyReports()" class="text-xs text-blue-600 hover:underline">Refresh</button>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead>
              <tr class="text-left border-b border-gray-200">
                <th class="px-3 py-3 font-semibold text-gray-600">Report</th>
                <th class="px-3 py-3 font-semibold text-gray-600">Status</th>
                <th class="px-3 py-3 font-semibold text-gray-600">Action</th>
                <th class="px-3 py-3 font-semibold text-gray-600"></th>
              </tr>
            </thead>
            <tbody id="my-reports-body">
              <tr>
                <td colspan="4" class="px-4 py-6 text-center text-gray-400">Loading your reports...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- Edit Report Modal -->
    <div id="report-edit-modal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-white rounded-lg shadow-xl w-full max-w-lg overflow-hidden border border-gray-100">
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
          <h3 class="text-base font-bold text-gray-900">Edit My Report</h3>
          <button onclick="closeReportEditModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <form id="my-report-edit-form" class="p-6 space-y-4">
          <input type="hidden" id="modal-edit-id" />
          <div>
            <label for="modal-edit-title" class="block text-sm font-medium mb-1 text-gray-700">Title</label>
            <input id="modal-edit-title" type="text" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800" required />
          </div>
          <div>
            <label for="modal-edit-category" class="block text-sm font-medium mb-1 text-gray-700">Category</label>
            <select id="modal-edit-category" class="w-full border rounded px-3 py-2 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-800" required>
              <option value="Lost & Found">Lost &amp; Found</option>
              <option value="Incident">Incident</option>
              <option value="Emergency">Emergency</option>
              <option value="Other">Other School Concern</option>
            </select>
          </div>
          <div>
            <label for="modal-edit-description" class="block text-sm font-medium mb-1 text-gray-700">Description</label>
            <textarea id="modal-edit-description" rows="4" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800" required></textarea>
          </div>
          <div>
            <label for="modal-edit-image" class="block text-sm font-medium mb-1 text-gray-700">Replace Image (Optional)</label>
            <input id="modal-edit-image" type="file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-900 hover:file:bg-blue-100 cursor-pointer" />
            <p class="text-xs text-gray-400 mt-1">Leave empty to keep current image.</p>
          </div>
          <div class="flex items-center justify-end gap-3 pt-3 border-t border-gray-100">
            <button type="button" onclick="closeReportEditModal()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 font-medium">Cancel</button>
            <button id="modal-edit-save-btn" type="submit" class="bg-blue-900 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2 rounded transition">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    let currentUser = null;
    let myReportsData = [];

    // Initialize page
    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Require user to be logged in
      currentUser = await requireAuth();
      if (!currentUser) return;

      // 2. Load the current user's reports
      await loadMyReports();

      // 3. Setup image preview on file selection
      const imageFileInput = document.getElementById('image-file');
      const previewContainer = document.getElementById('preview-container');
      const imagePreview = document.getElementById('image-preview');

      imageFileInput.addEventListener('change', () => {
        const file = imageFileInput.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            imagePreview.src = e.target.result;
            previewContainer.classList.remove('hidden');
          };
          reader.readAsDataURL(file);
        } else {
          previewContainer.classList.add('hidden');
          imagePreview.src = '';
        }
      });

      // Toggle item-status dropdown when Category is Lost & Found
      const categorySelect = document.getElementById('category');
      const itemStatusGroup = document.getElementById('item-status-group');
      categorySelect.addEventListener('change', () => {
        if (categorySelect.value === 'Lost & Found') {
          itemStatusGroup.classList.remove('hidden');
        } else {
          itemStatusGroup.classList.add('hidden');
        }
      });
    });

    // Handle Form Submit to create a report
    const form = document.getElementById('report-form');
    const infoBox = document.getElementById('info-box');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      infoBox.classList.add('hidden');
      errorBox.classList.add('hidden');

      if (!isConfigured()) {
        errorBox.textContent = 'Please configure your Supabase URL & Anon Key in supabase-config.js first.';
        errorBox.classList.remove('hidden');
        return;
      }

      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value.trim();
      const imageFile = document.getElementById('image-file').files[0];
      const itemStatusInput = document.getElementById('item-status');
      const itemStatusVal = (category === 'Lost & Found' && itemStatusInput) ? itemStatusInput.value : 'In Progress';

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        let imageUrl = null;

        // 1. Upload image to Supabase Storage if an image was picked
        if (imageFile) {
          submitBtn.textContent = 'Uploading image...';
          const fileExt = imageFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
          const filePath = `${currentUser.id}/${fileName}`;

          const { data: uploadData, error: uploadError } = await supabaseClient
            .storage
            .from('report-images')
            .upload(filePath, imageFile);

          if (uploadError) {
            console.warn('Image upload failed, proceeding without image:', uploadError);
          } else {
            const { data: urlData } = supabaseClient
              .storage
              .from('report-images')
              .getPublicUrl(filePath);

            imageUrl = urlData?.publicUrl || null;
          }
        }

        // 2. Insert report into the 'reports' table in Supabase
        submitBtn.textContent = 'Saving report...';
        const basePayload = {
          user_id: currentUser.id,
          user_name: currentUser.name,
          user_email: currentUser.email,
          title: title,
          category: category,
          description: description,
          image_url: imageUrl,
          status: 'pending' // Initial admin review status
        };

        // Try insert with item_status first
        let { error: insertError } = await supabaseClient
          .from('reports')
          .insert({ ...basePayload, item_status: itemStatusVal });

        // Graceful fallback if item_status column not yet added to table
        if (insertError && (insertError.code === 'PGRST204' || (insertError.message && insertError.message.includes('item_status')))) {
          const res = await supabaseClient.from('reports').insert(basePayload);
          insertError = res.error;
        }

        if (insertError) throw insertError;

        // 3. Reset form and show success message
        form.reset();
        document.getElementById('preview-container').classList.add('hidden');
        document.getElementById('item-status-group').classList.add('hidden');
        infoBox.textContent = 'Report submitted successfully! Status: Pending administrator review.';
        infoBox.classList.remove('hidden');

        // 4. Refresh My Reports table
        await loadMyReports();
      } catch (err) {
        console.error('Error submitting report:', err);
        errorBox.textContent = err.message || 'Failed to submit report. Please try again.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Report';
      }
    });

    // Fetch and display only the logged-in student's reports
    async function loadMyReports() {
      const tbody = document.getElementById('my-reports-body');

      try {
        if (!isConfigured()) return;

        const { data, error } = await supabaseClient
          .from('reports')
          .select('*')
          .eq('user_id', currentUser.id)
          .order('id', { ascending: false });

        if (error) throw error;

        myReportsData = data || [];

        if (!data || data.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" class="px-4 py-6 text-center text-gray-400">No reports submitted yet.</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = data.map(report => {
          const statusBadge = renderStatusBadge(report);
          const itemStatus = getItemStatus(report);
          const isFoundOrResolved = (itemStatus === 'Found' || itemStatus === 'Resolved' || report.status === 'resolved');
          const isApprovedOrResolved = (report.status === 'approved' || report.status === 'resolved');

          const dateStr = new Date(report.created_at).toLocaleDateString('en-US', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          });

          let actionHtml = '<span class="text-xs text-gray-400">Awaiting Admin</span>';
          if (report.status === 'rejected') {
            actionHtml = '<span class="text-xs text-red-400">Declined</span>';
          } else if (isApprovedOrResolved) {
            const isLostFound = (report.category === 'Lost & Found');
            if (isLostFound) {
              actionHtml = `
                <button 
                  onclick="quickToggleStatus(${report.id}, '${isFoundOrResolved ? 'missing' : 'found'}')"
                  class="text-xs px-2.5 py-1 rounded font-medium border transition ${
                    isFoundOrResolved 
                      ? 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100' 
                      : 'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100'
                  }"
                  title="${isFoundOrResolved ? 'Mark as Still Missing' : 'Mark as Found'}"
                >
                  ${isFoundOrResolved ? '↺ Mark Missing' : '✓ Mark Found'}
                </button>
              `;
            } else {
              actionHtml = `
                <button 
                  onclick="quickToggleStatus(${report.id}, '${isFoundOrResolved ? 'open' : 'resolved'}')"
                  class="text-xs px-2.5 py-1 rounded font-medium border transition ${
                    isFoundOrResolved 
                      ? 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100' 
                      : 'bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100'
                  }"
                  title="${isFoundOrResolved ? 'Reopen incident' : 'Mark as Resolved'}"
                >
                  ${isFoundOrResolved ? '↺ Reopen' : '✓ Mark Resolved'}
                </button>
              `;
            }
          }

          return `
            <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
              <td class="px-3 py-3">
                <a href="view_report.html?id=${report.id}" class="text-gray-900 font-medium hover:text-blue-900 hover:underline">
                  ${escapeHtml(report.title)}
                </a>
                <span class="block text-xs text-gray-400 font-mono">#${report.id} • ${escapeHtml(report.category || 'Incident')}</span>
              </td>
              <td class="px-3 py-3">
                ${statusBadge}
              </td>
              <td class="px-3 py-3">
                ${actionHtml}
              </td>
              <td class="px-3 py-3 text-right whitespace-nowrap">
                <button onclick="openReportEditModal(${report.id})" class="text-blue-600 hover:text-blue-800 text-xs font-medium hover:underline mr-2" title="Edit">✎ Edit</button>
                <button onclick="deleteMyReport(${report.id}, '${escapeHtml(report.title).replace(/'/g, "\\'")}')" class="text-red-500 hover:text-red-700 text-xs font-medium hover:underline" title="Delete">✕ Delete</button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('Error loading my reports:', err);
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="px-4 py-4 text-center text-red-500">Failed to load reports: ${err.message}</td>
          </tr>
        `;
      }
    }

    // Quick toggle for student's own report
    async function quickToggleStatus(reportId, targetState) {
      const isFound = (targetState === 'found' || targetState === 'resolved');
      const confirmMsg = isFound ? 'Mark this report as Found / Resolved?' : 'Mark this report as Still Missing / In Progress?';
      if (!confirm(confirmMsg)) return;

      try {
        const newItemStatus = isFound ? 'Found' : 'Still Missing';
        const newAdminStatus = isFound ? 'resolved' : 'approved';
        await updateReportItemStatus(reportId, newItemStatus, newAdminStatus);
        await loadMyReports();
      } catch (err) {
        alert('Failed to update status: ' + err.message);
      }
    }

    // Delete report from My Reports table
    async function deleteMyReport(reportId, title) {
      if (!confirm(`Are you sure you want to permanently delete "${title}"?\n\nThis action cannot be undone.`)) return;

      try {
        await deleteReportById(reportId);

        infoBox.textContent = 'Report deleted successfully.';
        infoBox.classList.remove('hidden');
        await loadMyReports();
      } catch (err) {
        alert(err.message);
      }
    }

    // Open Edit Modal for a report
    function openReportEditModal(reportId) {
      const r = myReportsData.find(item => item.id === reportId);
      if (!r) return;
      document.getElementById('modal-edit-id').value = r.id;
      document.getElementById('modal-edit-title').value = r.title || '';
      document.getElementById('modal-edit-category').value = r.category || 'Incident';
      document.getElementById('modal-edit-description').value = r.description || '';
      document.getElementById('modal-edit-image').value = '';
      document.getElementById('report-edit-modal').classList.remove('hidden');
    }

    function closeReportEditModal() {
      document.getElementById('report-edit-modal').classList.add('hidden');
    }

    // Submit handler for Edit Modal in report.html
    document.getElementById('my-report-edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('modal-edit-id').value;
      const saveBtn = document.getElementById('modal-edit-save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const r = myReportsData.find(item => item.id == id);
        let imageUrl = r ? r.image_url : null;
        const newImageFile = document.getElementById('modal-edit-image').files[0];

        if (newImageFile) {
          saveBtn.textContent = 'Uploading image...';
          const fileExt = newImageFile.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
          const filePath = `${currentUser.id}/${fileName}`;

          const { error: uploadError } = await supabaseClient.storage.from('report-images').upload(filePath, newImageFile);
          if (!uploadError) {
            const { data: urlData } = supabaseClient.storage.from('report-images').getPublicUrl(filePath);
            imageUrl = urlData?.publicUrl || imageUrl;
          }
        }

        saveBtn.textContent = 'Saving...';
        await updateReportById(id, {
          title: document.getElementById('modal-edit-title').value.trim(),
          category: document.getElementById('modal-edit-category').value,
          description: document.getElementById('modal-edit-description').value.trim(),
          image_url: imageUrl
        });

        closeReportEditModal();
        infoBox.textContent = 'Report updated successfully.';
        infoBox.classList.remove('hidden');
        await loadMyReports();
      } catch (err) {
        alert(err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    });
  </script>
</body>
</html>
