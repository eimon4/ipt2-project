<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwiftTrack - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 relative">
  <!-- Top Header Bar -->
  <header class="absolute top-0 left-0 w-full bg-blue-900 text-white shadow">
    <div class="w-full px-6 py-3 flex items-center justify-between">
      <div class="font-bold text-xl tracking-tight">SwiftTrack.</div>
    </div>
  </header>

  <!-- Register Card -->
  <div class="w-full max-w-md bg-white shadow rounded p-6 mt-12 sm:mt-0">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Register</h1>

    <!-- Alerts -->
    <div id="error-box" class="hidden mb-4 p-3 rounded bg-red-100 text-red-700 text-sm"></div>
    <div id="success-box" class="hidden mb-4 p-3 rounded bg-green-100 text-green-700 text-sm"></div>

    <form id="register-form" class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium mb-1 text-gray-700">Full Name</label>
        <input 
          id="name" 
          name="name" 
          type="text" 
          placeholder="Juan Dela Cruz"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
          required 
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium mb-1 text-gray-700">Email</label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          placeholder="student@school.edu"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
          required 
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1 text-gray-700">Password</label>
        <input 
          id="password" 
          name="password" 
          type="password" 
          placeholder="At least 6 characters"
          minlength="6"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-800" 
          required 
        />
      </div>

      <button 
        id="submit-btn" 
        type="submit" 
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-medium rounded px-3 py-2 transition"
      >
        Create Account
      </button>
    </form>

    <p class="mt-4 text-sm text-center text-gray-600">
      Already have an account? <a class="text-blue-600 hover:underline font-medium" href="index.html">Login</a>
    </p>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      checkConfigNotice();
    });

    const form = document.getElementById('register-form');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      successBox.classList.add('hidden');

      if (!isConfigured()) {
        errorBox.textContent = 'Please configure your Supabase URL & Anon Key in supabase-config.js first.';
        errorBox.classList.remove('hidden');
        return;
      }

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = 'user'; // Standard registration always creates regular student accounts

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        // 1. Sign up with Supabase Auth, storing metadata
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              name: name,
              role: role,
            }
          }
        });

        if (error) {
          throw error;
        }

        if (data.user) {
          // 2. Also ensure profile is inserted in public.profiles table
          await supabaseClient.from('profiles').upsert({
            id: data.user.id,
            name: name,
            email: email,
            role: role,
          });
        }

        // If email confirmation is disabled (standard for development), user session is active immediately
        if (data.session) {
          successBox.textContent = 'Account created successfully! Redirecting...';
          successBox.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = 'feed.html';
          }, 1200);
        } else {
          // If Supabase has email confirmation enabled
          successBox.textContent = 'Account created! Please check your email to confirm your account, then log in.';
          successBox.classList.remove('hidden');
          form.reset();
        }
      } catch (err) {
        errorBox.textContent = err.message || 'Failed to create account.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
